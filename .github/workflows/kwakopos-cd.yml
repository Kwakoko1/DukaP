name: KwakoPos Multi-Tier CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres-mock:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: kwakopos_test
          POSTGRES_USER: kwako_operator
          POSTGRES_PASSWORD: test_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kwako_operator -d kwakopos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Platform Dependencies
        run: npm ci

      - name: Verify Native Stream Parser & Sanitizer
        run: npm run test:parser
        env:
          NODE_ENV: test

      - name: Validate Database Schema Initialization & Auto-Migration
        run: node -e "import('./server.js').then(m => process.exit(0)).catch(e => { console.error(e); process.exit(1); })"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://kwako_operator:test_secure_password@localhost:5432/kwakopos_test

  deploy-to-production:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Cloud Production Credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true

      - name: Build and Push Production Container
        run: |
          echo "Building container revision..."
          # gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/kwakopos-engine:${{ github.sha }} .
        continue-on-error: true

      - name: Deploy Revision to Live Compute Container Cluster
        run: |
          echo "Deploying Cloud Run revision..."
          # gcloud run deploy kwakopos-production-service \
          #   --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/kwakopos-engine:${{ github.sha }} \
          #   --region us-central1 \
          #   --platform managed \
          #   --allow-unauthenticated
        continue-on-error: true
