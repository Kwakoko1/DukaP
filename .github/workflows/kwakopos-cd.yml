name: KwakoPos Multi-Tier Real Immutable CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-test:
    name: kwakopos / cd-preflight-validation
    runs-on: ubuntu-latest
    
    services:
      postgres-mock:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: kwakopos_test
          POSTGRES_USER: kwako_operator
          POSTGRES_PASSWORD: test_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kwako_operator -d kwakopos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Platform Dependencies
        run: npm ci

      - name: Verify Native Stream Parser & Sanitizer
        run: npm run test:parser
        env:
          NODE_ENV: test

      - name: Validate Database Schema Initialization & Auto-Migration
        run: node -e "import('./server.js').then(m => process.exit(0)).catch(e => { console.error(e); process.exit(1); })"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://kwako_operator:test_secure_password@localhost:5432/kwakopos_test

  deploy-to-production:
    name: kwakopos / cloud-run-immutable-cd
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker CLI for GCP Registry
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Tagged Container Image
        id: build-image
        run: |
          IMAGE_NAME="gcr.io/${{ secrets.GCP_PROJECT_ID }}/kwakopos-engine"
          TAG="${{ github.sha }}"
          
          echo "Building production Docker image: ${IMAGE_NAME}:${TAG}..."
          docker build -t "${IMAGE_NAME}:${TAG}" -t "${IMAGE_NAME}:latest" .
          
          echo "Pushing image to GCP Container Registry..."
          docker push "${IMAGE_NAME}:${TAG}"
          docker push "${IMAGE_NAME}:latest"
          
          IMAGE_DIGEST=$(gcloud container images describe "${IMAGE_NAME}:${TAG}" --format='value(image_summary.digest)')
          echo "IMMUTABLE_DIGEST=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          echo "Captured immutable image digest: ${IMAGE_DIGEST}"

      - name: Deploy Revision using Immutable Image Digest
        run: |
          IMAGE_NAME="gcr.io/${{ secrets.GCP_PROJECT_ID }}/kwakopos-engine"
          DIGEST="${{ steps.build-image.outputs.IMMUTABLE_DIGEST }}"
          IMMUTABLE_IMAGE_URI="${IMAGE_NAME}@${DIGEST}"
          
          echo "Deploying immutable image revision to Cloud Run: ${IMMUTABLE_IMAGE_URI}..."
          gcloud run deploy kwakopos-production-service \
            --image "${IMMUTABLE_IMAGE_URI}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GIT_SHA=${{ github.sha }},CONTAINER_IMAGE_DIGEST=${DIGEST},NODE_ENV=production"

      - name: Verify Live Cloud Run Revision Health & Version
        run: |
          SERVICE_URL=$(gcloud run services describe kwakopos-production-service --region us-central1 --format='value(status.url)')
          echo "Live Cloud Run URL: ${SERVICE_URL}"
          
          echo "Probing GET ${SERVICE_URL}/api/version..."
          curl -f "${SERVICE_URL}/api/version"
          
          echo "Probing GET ${SERVICE_URL}/api/health..."
          curl -f "${SERVICE_URL}/api/health"
