name: KwakoPos SaaS Automated Release & CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  release-and-deploy:
    name: SemVer Calculation, GitHub Release & Production CD
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute SemVer & Changelog Release Engine
        id: release
        run: node scripts/release-engine.js

      - name: Commit Updated Version & Changelog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain package.json CHANGELOG.md)" ]; then
            VERSION=$(node -e "console.log(require('./package.json').version)")
            git add package.json CHANGELOG.md
            git commit -m "chore(release): version ${VERSION} [skip ci]"
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin main
            git push origin "v${VERSION}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: Version ${{ steps.release.outputs.version }} — Automated KwakoPos SaaS Release
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Production Application Bundle
        run: npm run build

      - name: Post-Deployment Automated Health Verification
        id: health_probe
        run: npm run health-check
        env:
          HEALTH_CHECK_URL: 'http://localhost:8080'

      - name: Trigger Automated Rollback on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'rollback.yml',
              ref: 'main',
              inputs: {
                reason: 'Post-deployment health check or production validation failed.'
              }
            });
