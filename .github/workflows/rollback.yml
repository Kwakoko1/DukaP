name: KwakoPos SaaS Automated Rollback Engine

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for triggering automated rollback'
        required: true
        default: 'Production health probe failed'

jobs:
  execute-rollback:
    name: Execute Automated Application & Database Rollback
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Identify Previous Stable Tag
        id: previous_tag
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="v1.0.0"
          fi
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "[Rollback Engine] Target stable release tag identified: $PREV_TAG"

      - name: Checkout Previous Stable Release
        run: |
          git checkout ${{ steps.previous_tag.outputs.previous_tag }}

      - name: Rebuild Stable Production Bundle
        run: npm run build

      - name: Dispatch Emergency System Alert
        run: |
          echo "🚨 [AUTOMATED ROLLBACK EXECUTED] KwakoPos SaaS rolled back to ${{ steps.previous_tag.outputs.previous_tag }}. Reason: ${{ github.event.inputs.reason }}"
