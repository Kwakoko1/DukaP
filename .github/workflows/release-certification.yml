name: KwakoPos Production Release Candidate Certification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: kwakopos / lint-oxlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typescript:
    name: kwakopos / typescript-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -b

  architecture-audit:
    name: kwakopos / static-architecture-ast-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:audit-architecture

  reliability-suite:
    name: kwakopos / core-reliability-engine-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:all

  production-release-certification:
    name: kwakopos / deployment-real-release-certification-gate
    needs: [lint, typescript, architecture-audit, reliability-suite]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kwakopos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Production Distribution Web App Bundle
        run: npm run build

      - name: Verify PostgreSQL DB Connection & Seed Schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kwakopos
        run: node scripts/db-health-check.js

      - name: Start Real Deployed Production Backend Service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kwakopos
          PORT: 8080
          NODE_ENV: production
        run: |
          npm run start &
          sleep 5

      - name: Verify Deployed Preflight Endpoints (Version / Health / Readiness)
        run: |
          curl -f http://127.0.0.1:8080/api/version
          curl -f http://127.0.0.1:8080/api/health
          curl -f http://127.0.0.1:8080/api/readiness

      - name: Execute Fail-Closed Production Certification Runner Gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kwakopos
        run: npm run production:certify

      - name: Upload Signed Release Certificates & Artifact Evidence Handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwakopos-production-certification-artifacts
          path: |
            release-manifest.json
            kwakopos-release-certificate.json
            kwakopos-release-certificate.md
            artifacts/release-candidate/

