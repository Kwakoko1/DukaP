name: KwakoPos SaaS Production Reliability & CI Gate

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-quality-gates:
    name: Code Quality, Reliability & Distributed Consistency Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kwakopos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Quality Gate 1 - Static Code Analysis & Linter
        run: npm run lint

      - name: Quality Gate 2 - Strict TypeScript Type Checking & Vite Build
        run: npm run build

      - name: Quality Gate 3 - Database Migration & Health Check
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/kwakopos
          JWT_SECRET: ci-test-jwt-secret-key-32-chars-long-secure
          SESSION_SECRET: ci-test-session-secret-key-32-chars-long-secure
        run: |
          npm run db:migrate
          npm run db:check

      - name: Quality Gate 4 - Full Production Reliability & Certification Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/kwakopos
          JWT_SECRET: ci-test-jwt-secret-key-32-chars-long-secure
          SESSION_SECRET: ci-test-session-secret-key-32-chars-long-secure
          PORT: 8080
        run: |
          node server.js &
          sleep 3
          npm run production:certify

      - name: Quality Gate 5 - Bundle Artifact Check
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: Production bundle directory 'dist' was not generated!"
            exit 1
          fi
          echo "Production build size:"
          du -sh dist/

      - name: Archive Production Reliability Certification Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kwakopos-production-certification
          path: |
            artifacts/kwakopos-production-certification.json
            artifacts/kwakopos-production-certification.md
