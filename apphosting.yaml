# Firebase AppHosting Configuration for KwakoPOS Web App
runConfig:
  concurrency: 40      # Optimized to prevent CPU thrashing on 1 vCPU
  cpu: 1
  memoryMiB: 1024      # 1GB to prevent Node.js OOM crashes

env:
  - variable: PORT
    value: "8080"
  - variable: APP_ENV
    value: "production"
  - variable: NODE_ENV
    value: "production"
  # DATABASE_URL and JWT_SECRET should be configured via Cloud Secret Manager in production

