# Firebase AppHosting Configuration for DukaPos Web App
runConfig:
  concurrency: 40      # Optimized to prevent CPU thrashing on 1 vCPU
  cpu: 1
  memoryMiB: 1024      # 1GB to prevent Node.js OOM crashes

secrets:
  - variable: DATABASE_URL
    secret: DUKAPOS_PROD_DB_URL
  - variable: VITE_POSTGRES_URL
    secret: DUKAPOS_PROD_DB_URL

env:
  - variable: PORT
    value: "8080"
